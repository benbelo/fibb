<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fibb</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>fibb</h1>
    <div class="header-actions">
      <button id="add-item" type="button">+ Ajouter</button>
      <button id="theme-toggle" type="button" title="Changer de thème">🌙</button>
    </div>
  </header>

  <main>
    <section class="totals">
      <div class="total total-net">
        <span class="total-label">Patrimoine net</span>
        <span class="total-value" id="total-net">—</span>
      </div>
      <div class="total total-brut">
        <span class="total-label">Patrimoine brut</span>
        <span class="total-value" id="total-brut">—</span>
      </div>
    </section>

    <section class="categories" id="categories"></section>
  </main>

  <dialog id="item-dialog">
    <form id="item-form">
      <h2 id="dialog-title">Ajouter un élément</h2>

      <label>Nom
        <input name="nom" required>
      </label>
      <label>Catégorie
        <select name="categorie">
          <option value="comptes">Comptes</option>
          <option value="investissements">Investissements</option>
          <option value="epargne">Épargne</option>
          <option value="credits">Crédits</option>
        </select>
      </label>
      <label>Montant
        <input name="montant" type="number" step="0.01" required>
      </label>
      <label>Établissement
        <input name="etablissement" placeholder="optionnel">
      </label>
      <label>Taux (%)
        <input name="taux" type="number" step="0.01" placeholder="optionnel">
      </label>
      <label>Échéance
        <input name="echeance" placeholder="optionnel, ex. 2045-06">
      </label>

      <p class="error" id="dialog-error"></p>

      <div class="dialog-actions">
        <button type="button" id="dialog-cancel">Annuler</button>
        <button type="submit">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
